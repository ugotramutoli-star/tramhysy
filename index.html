<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAM HYSY — Ipersimmetria Ω</title>
  <style>
    :root {
      --bg: #050507;
      --text: #f5f7fa;
      --muted: #cbd5e1;
      --gold: #d4af37;
      --silver: #cbd5e1;
      --bronze: #c88a5b;
      --nav-h: 58px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: var(--nav-h);
      overflow-x: hidden;
    }

    /* Barra superiore fissa */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(5, 5, 8, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      list-style: none;
      font-size: 0.85rem;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
    }

    .c-gold { color: var(--gold); }
    .c-silver { color: var(--silver); }
    .c-bronze { color: var(--bronze); }

    /* Scena con vortice a sfondo pieno */
    .stage {
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px 28px;
      background: #000;
      overflow: hidden;
    }

    video.vortex-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.15);
      z-index: 1;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.72) 100%);
    }

    .stage-top {
      position: relative;
      z-index: 3;
      text-align: center;
    }

    .stage-title {
      font-size: clamp(1.8rem, 3.8vw, 2.8rem);
      font-weight: 700;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }

    .stage-sub {
      font-size: clamp(0.95rem, 1.7vw, 1.15rem);
      font-style: italic;
      color: #e2e8f0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    /* Tre riquadri compatti centrati */
    .pillars-row {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 18px auto;
    }

    .pillar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: rgba(10, 12, 18, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 10px 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .pillar-box:hover { transform: translateY(-3px); }

    .box-gold { border-top: 3px solid var(--gold); }
    .box-silver { border-top: 3px solid var(--silver); }
    .box-bronze { border-top: 3px solid var(--bronze); }

    /* Dimensione rigorosamente bloccata per evitare monete giganti */
    .pillar-box img {
      width: 104px !important;
      height: 104px !important;
      max-width: 104px !important;
      max-height: 104px !important;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .pillar-name {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .box-gold .pillar-name { color: var(--gold); }
    .box-silver .pillar-name { color: var(--silver); }
    .box-bronze .pillar-name { color: var(--bronze); }

    .stage-bottom {
      position: relative;
      z-index: 3;
      text-align: center;
    }

    .plenum-title {
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 600;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    .audio-row {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-audio {
      background: rgba(12, 14, 22, 0.88);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .audio-msg {
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .pillars-row {
        grid-template-columns: 1fr;
        max-width: 300px;
        gap: 10px;
      }

      .pillar-box {
        flex-direction: row;
        gap: 12px;
        padding: 8px 12px;
      }

      .pillar-box img {
        width: 58px !important;
        height: 58px !important;
        max-width: 58px !important;
        max-height: 58px !important;
        margin-bottom: 0;
      }

      .nav-links {
        gap: 10px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="#top" class="brand">
      <img src="assets/img/respiro.jpg" alt="Logo Respiro" />
      <span>TRAM HYSY</span>
    </a>
    <nav aria-label="Pilastri">
      <ul class="nav-links">
        <li><a href="deng/" class="c-gold">A · Politica</a></li>
        <li><a href="hysy/fisica-matematica/" class="c-silver">B · Scienza</a></li>
        <li><a href="nugae/" class="c-bronze">C · Poesia</a></li>
      </ul>
    </nav>
  </header>

  <main id="top" class="stage">
    <video id="vortexVideo" class="vortex-bg" src="assets/video/vortice.mp4" autoplay muted playsinline loop preload="auto"></video>
    <div class="stage-overlay"></div>

    <div class="stage-top">
      <h1 class="stage-title">Ipersimmetria &Omega;</h1>
      <p class="stage-sub">il respiro dell'&Aacute;peiron</p>
    </div>

    <div class="pillars-row">
      <a href="deng/" class="pillar-box box-gold">
        <img src="assets/img/deng.jpg" alt="Politica — Deng" />
        <span class="pillar-name">politica</span>
      </a>

      <a href="hysy/fisica-matematica/" class="pillar-box box-silver">
        <img src="assets/img/hysy.jpg" alt="Scienza — HYSY" />
        <span class="pillar-name">scienza</span>
      </a>

      <a href="nugae/" class="pillar-box box-bronze">
        <img src="assets/img/nugae.jpg" alt="Poesia — Nugae" />
        <span class="pillar-name">poesia</span>
      </a>
    </div>

    <div class="stage-bottom">
      <p class="plenum-title">a-metric plenum &Omega;</p>
      <div class="audio-row">
        <button type="button" class="btn-audio" id="btnAudio">Attiva Audio</button>
        <span class="audio-msg" id="audioMsg"></span>
      </div>
    </div>
  </main>

  <script>
    const videoEl = document.getElementById("vortexVideo");
    const audioBtn = document.getElementById("btnAudio");
    const audioMsg = document.getElementById("audioMsg");

    audioBtn.addEventListener("click", async () => {
      try {
        videoEl.muted = !videoEl.muted;
        videoEl.volume = 1.0;
        await videoEl.play();
        if (videoEl.muted) {
          audioBtn.textContent = "Attiva Audio";
          audioMsg.textContent = "";
        } else {
          audioBtn.textContent = "Muta Audio";
          audioMsg.textContent = "Se non c'è audio, controlla che vortice.mp4 abbia una traccia audio";
        }
      } catch (e) {
        audioMsg.textContent = "Riproduzione audio bloccata dal browser";
      }
    });
  </script>
</body>
</html>
