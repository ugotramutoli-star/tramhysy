<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAM HYSY — Ipersimmetria Ω</title>
  <style>
    :root {
      --bg: #050507;
      --surface: #0c0d11;
      --text: #f5f7fa;
      --muted: #b8c0cc;
      --gold: #d4af37;
      --silver: #cbd5e1;
      --bronze: #c88a5b;
      --nav-h: 58px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: var(--nav-h);
      overflow-x: hidden;
    }

    /* Barra superiore fissa con link centrati */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 999;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      background: rgba(5, 5, 8, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      grid-column: 1;
      justify-self: start;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
    }

    .center-nav {
      grid-column: 2;
      justify-self: center;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      list-style: none;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
    }

    .c-gold { color: var(--gold); }
    .c-silver { color: var(--silver); }
    .c-bronze { color: var(--bronze); }
    .c-author { color: var(--text); opacity: 0.92; }
    .c-author:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }

    /* Scena con vortice a sfondo pieno */
    .stage {
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #000;
      overflow: hidden;
    }

    video.vortex-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.12);
      z-index: 1;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.72) 100%);
    }

    /* Tre riquadri compatti centrati */
    .pillars-row {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: auto;
    }

    .pillar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: rgba(10, 12, 18, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 10px 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .pillar-box:hover { transform: translateY(-3px); }

    .box-gold { border-top: 3px solid var(--gold); }
    .box-silver { border-top: 3px solid var(--silver); }
    .box-bronze { border-top: 3px solid var(--bronze); }

    .pillar-box img {
      width: 104px !important;
      height: 104px !important;
      max-width: 104px !important;
      max-height: 104px !important;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .pillar-name {
