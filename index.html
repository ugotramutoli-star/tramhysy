<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAM HYSY — Ipersimmetria Ω</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .home-stage {
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #000;
      overflow: hidden;
    }

    video.vortex-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.12);
      z-index: 1;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.72) 100%);
    }

    .pillars-row {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: auto;
    }

    .pillar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: rgba(10, 12, 18, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 10px 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .pillar-box:hover {
      transform: translateY(-3px);
    }

    .box-gold {
      border-top: 3px solid var(--gold);
    }

    .box-silver {
      border-top: 3px solid var(--silver);
    }

    .box-bronze {
      border-top: 3px solid var(--bronze);
    }

    .pillar-box img {
      width: 104px !important;
      height: 104px !important;
      max-width: 104px !important;
      max-height: 104px !important;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .pillar-name {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .box-gold .pillar-name {
      color: var(--gold);
    }

    .box-silver .pillar-name {
      color: var(--silver);
    }

    .box-bronze .pillar-name {
      color: var(--bronze);
    }

    .audio-row {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="#top" class="brand">
      <img src="assets/img/respiro.jpg" alt="Logo Respiro" />
      <span class="brand-label">TRAM HYSY</span>
    </a>
    <nav class="center-nav" aria-label="Sezioni principali">
      <ul class="nav-links">
        <li><a href="deng/" class="c-gold">Politica</a></li>
        <li><a href="hysy/" class="c-silver">Scienza</a></li>
        <li><a href="nugae/" class="c-bronze">Poesia</a></li>
        <li><a href="#autore" id="navAuthorLink" class="c-author">Autore</a></li>
      </ul>
    </nav
