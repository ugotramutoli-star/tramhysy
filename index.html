<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAM HYSY — Ipersimmetria Ω</title>
  <style>
    :root {
      --bg: #050507;
      --text: #f5f7fa;
      --muted: #b8c0cc;
      --gold: #d4af37;
      --silver: #cbd5e1;
      --bronze: #c88a5b;
      --nav-h: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: var(--nav-h);
      overflow-x: hidden;
    }

    /* Barra superiore fissa */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(5, 5, 8, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.92rem;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      list-style: none;
      font-size: 0.86rem;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .c-gold { color: var(--gold); }
    .c-silver { color: var(--silver); }
    .c-bronze { color: var(--bronze); }

    /* Scena principale con vortice e tre riquadri sovrapposti */
    .stage {
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 18px 34px;
      background: #000;
      overflow: hidden;
    }

    .vortex-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.16);
      transform-origin: center center;
      z-index: 1;
    }

    .stage-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(4, 6, 12, 0.22) 0%,
        rgba(4, 5, 9, 0.65) 72%,
        rgba(4, 4, 7, 0.92) 100%
      );
    }

    .stage-header {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 780px;
    }

    .stage-title {
      font-size: clamp(1.85rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
    }

    .stage-subtitle {
      margin-top: 4px;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      color: #e2e8f0;
      font-style: italic;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    /* Tre riquadri compatti e centrati sul vortice */
    .coins-row {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 22px auto;
    }

    .coin-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: rgba(8, 10, 16, 0.76);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 16px 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .coin-tile:hover {
      transform: translateY(-4px);
    }

    .tile-gold {
      border-top: 3px solid var(--gold);
    }
    .tile-gold:hover {
      border-color: var(--gold);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.35);
    }

    .tile-silver {
      border-top: 3px solid var(--silver);
    }
    .tile-silver:hover {
      border-color: var(--silver);
      box-shadow: 0 0 24px rgba(203, 213, 225, 0.3);
    }

    .tile-bronze {
      border-top: 3px solid var(--bronze);
    }
    .tile-bronze:hover {
      border-color: var(--bronze);
      box-shadow: 0 0 24px rgba(200, 138, 91, 0.35);
    }

    .coin-circle {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .coin-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .coin-label {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .tile-gold .coin-label { color: var(--gold); }
    .tile-silver .coin-label { color: var(--silver); }
    .tile-bronze .coin-label { color: var(--bronze); }

    .coin-sub {
      margin-top: 2px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .stage-footer {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 720px;
    }

    .plenum-tag {
      font-size: clamp(1rem, 2.2vw, 1.45rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    .controls-bar {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .audio-btn {
      background: rgba(10, 12, 18, 0.85);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .audio-status {
      font-size: 0.78rem;
      color: var(--muted);
      align-self: center;
    }

    @media (max-width: 720px) {
      .coins-row {
        grid-template-columns: 1fr;
        max-width: 320px;
        gap: 12px;
      }

      .coin-tile {
        flex-direction: row;
        gap: 14px;
        padding: 10px 14px;
        text-align: left;
      }

      .coin-circle {
        width: 68px;
        height: 68px;
        margin-bottom: 0;
      }

      .nav-links {
        gap: 10px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="#top" class="brand">
      <img src="assets/img/respiro.jpg" alt="Logo Respiro — TRAM HYSY" />
      <span>TRAM HYSY</span>
    </a>

    <nav aria-label="Pilastri">
      <ul class="nav-links">
        <li><a href="deng/" class="c-gold">A · Politica</a></li>
        <li><a href="hysy/fisica-matematica/" class="c-silver">B · Scienza</a></li>
        <li><a href="nugae/" class="c-bronze">C · Poesia</a></li>
      </ul>
    </nav>
  </header>

  <main id="top" class="stage">
    <video id="vortexVideo" class="vortex-bg" src="assets/video/vortice.mp4" autoplay muted playsinline loop preload="auto"></video>
    <div class="stage-vignette"></div>

    <div class="stage-header">
      <h1 class="stage-title">Ipersimmetria &Omega;</h1>
      <p class="stage-subtitle">il respiro dell'&Aacute;peiron</p>
    </div>

    <div class="coins-row">
      <a href="deng/" class="coin-tile tile-gold">
        <span class="coin-circle">
          <img src="assets/img/deng.jpg" alt="Moneta Politica — Deng" />
        </span>
        <span>
          <span class="coin-label">politica</span>
          <span class="coin-sub">Deng · Oro</span>
        </span>
      </a>

      <a href="hysy/fisica-matematica/" class="coin-tile tile-silver">
        <span class="coin-circle">
          <img src="assets/img/hysy.jpg" alt="Moneta Scienza — HYSY" />
        </span>
        <span>
          <span class="coin-label">scienza</span>
          <span class="coin-sub">HYSY · Fisica &amp; Matematica</span>
        </span>
      </a>

      <a href="nugae/" class="coin-tile tile-bronze">
        <span class="coin-circle">
          <img src="assets/img/nugae.jpg" alt="Moneta Poesia — Nugae" />
        </span>
        <span>
          <span class="coin-label">poesia</span>
          <span class="coin-sub">Nugae · Il Mio Tao</span>
        </span>
      </a>
    </div>

    <div class="stage-footer">
      <p class="plenum-tag">a-metric plenum &Omega;</p>
      <div class="controls-bar">
        <button type="button" class="audio-btn" id="audioToggle">Attiva Audio</button>
        <span class="audio-status" id="audioStatus"></span>
      </div>
    </div>
  </main>

  <script>
    const vid = document.getElementById("vortexVideo");
    const btn = document.getElementById("audioToggle");
    const statusEl = document.getElementById("audioStatus");

    btn.addEventListener("click", async () => {
      try {
        vid.muted = !vid.muted;
        vid.volume = 1.0;
        await vid.play();
        if (vid.muted) {
          btn.textContent = "Attiva Audio";
          statusEl.textContent = "";
        } else {
          btn.textContent = "Muta Audio";
          statusEl.textContent = vid.mozHasAudio || vid.webkitAudioDecodedByteCount > 0
            ? "Audio attivo"
            : "Se non senti audio, verifica che vortice.mp4 contenga la traccia audio";
        }
      } catch (err) {
        statusEl.textContent = "Impossibile avviare l'audio automaticamente";
      }
    });
  </script>
</body>
</html>
